<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" width="400" height="100">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Logo Mark Nodes -->
  <g transform="translate(10, 10)">
    <polygon points="40,10 70,30 70,60 40,80 10,60 10,30" fill="none" stroke="url(#grad1)" stroke-width="4" filter="url(#glow)"/>
    <circle cx="40" cy="10" r="6" fill="#06b6d4"/>
    <circle cx="70" cy="30" r="6" fill="#a855f7"/>
    <circle cx="70" cy="60" r="6" fill="#6366f1"/>
    <circle cx="40" cy="80" r="6" fill="#06b6d4"/>
    <circle cx="10" cy="60" r="6" fill="#a855f7"/>
    <circle cx="10" cy="30" r="6" fill="#6366f1"/>
    <circle cx="40" cy="45" r="8" fill="url(#grad1)"/>
    <line x1="40" y1="10" x2="40" y2="45" stroke="url(#grad1)" stroke-width="2"/>
    <line x1="70" y1="30" x2="40" y2="45" stroke="url(#grad1)" stroke-width="2"/>
    <line x1="70" y1="60" x2="40" y2="45" stroke="url(#grad1)" stroke-width="2"/>
    <line x1="40" y1="80" x2="40" y2="45" stroke="url(#grad1)" stroke-width="2"/>
    <line x1="10" y1="60" x2="40" y2="45" stroke="url(#grad1)" stroke-width="2"/>
    <line x1="10" y1="30" x2="40" y2="45" stroke="url(#grad1)" stroke-width="2"/>
  </g>

  <!-- Text -->
  <text x="100" y="58" font-family="'Outfit', 'Inter', sans-serif" font-weight="800" font-size="36" fill="#ffffff" letter-spacing="2">
    PRODIGY
  </text>
  <text x="100" y="80" font-family="'Inter', sans-serif" font-weight="700" font-size="12" fill="#06b6d4" letter-spacing="3">
    META-VENTURE STUDIO
  </text>
</svg>
